<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#00f2fe" stroke-width="6" stroke-opacity="0.4" />

  <!-- OLED Eye Frame -->
  <rect x="76" y="156" width="360" height="200" rx="48" fill="#020617" stroke="#00f2fe" stroke-width="4" stroke-opacity="0.3" />

  <!-- Cyan OLED Eyes -->
  <g fill="#00f2fe" filter="url(#neonGlow)">
    <!-- Left Eye -->
    <rect x="120" y="200" width="105" height="112" rx="35" />
    <!-- Right Eye -->
    <rect x="287" y="200" width="105" height="112" rx="35" />
    <!-- Highlights -->
    <circle cx="145" cy="225" r="10" fill="#ffffff" />
    <circle cx="312" cy="225" r="10" fill="#ffffff" />
  </g>

  <!-- Sound Waves Indicator at Top -->
  <g stroke="#00f2fe" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <path d="M 236,105 Q 256,90 276,105" />
    <path d="M 220,90 Q 256,70 292,90" />
  </g>

  <!-- Subtitle Text -->
  <text x="256" y="420" fill="#00f2fe" font-family="sans-serif" font-size="28" font-weight="bold" letter-spacing="8" text-anchor="middle" opacity="0.9">BOWCON</text>
</svg>
